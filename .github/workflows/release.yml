name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      CC: clang-18
      LD_LLD: ld.lld-18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate tag
        run: |
          version=$(sed -n 's/^version=//p' module/module.prop)
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Install LLVM
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 lld-18
      - name: Test and build
        run: |
          python3 tools/test.py
          python3 tools/build.py
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=(--draft --verify-tag)
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease);; esac
          gh release create "$GITHUB_REF_NAME" dist/* "${flags[@]}" \
            --title "$GITHUB_REF_NAME" --notes-file doc/release-notes.md
